<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATTINERA</title>
<meta name="description" content="ATTINERA: phone-first wardrobe and daily-readiness planner. Dress for the day ahead.">
<meta name="theme-color" content="#577399">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ATTINERA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/attinera-logo-a.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="splash" aria-hidden="true"><img src="assets/attinera-logo-lockup.svg" alt="" width="300"></div>

<header class="topbar">
  <a href="#today" class="brand" aria-label="ATTINERA home">
    <img class="brand-icon" src="assets/attinera-logo-a.svg" alt="" width="36" height="36">
    <img class="brand-lockup" src="assets/attinera-logo-lockup.svg" alt="" width="190" height="53">
    <span class="brand-word">ATTINERA</span>
  </a>
</header>

<nav id="tabs" class="tabs" aria-label="Main"></nav>

<main id="view" tabindex="-1"><p class="pad muted">Loading…</p></main>

<button id="fab" class="fab" aria-label="Add item"></button>
<div id="toast" class="toast" role="status" hidden></div>

<footer class="foot">© 2026 EJ Empires · ATTINERA prototype · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · Weather by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>

<script>
  // ES modules don't load from file:// in most browsers.
  if (location.protocol === 'file:') {
    document.getElementById('splash').remove();
    document.getElementById('view').innerHTML =
      '<p class="pad">ATTINERA needs a tiny local server. In this folder run <code>python run.py</code>, then open <b>http://localhost:8000</b>.</p>';
  }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
