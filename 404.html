<title>ATTINERA</title>
<script>
  // GitHub Pages: unknown path -> back to the app. Project sites live under /<repo>/.
  var seg = location.pathname.split('/')[1];
  var base = location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/';
  location.replace(base + 'index.html' + location.hash);
</script>
</head>
